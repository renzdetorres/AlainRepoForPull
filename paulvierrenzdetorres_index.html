<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Button</title>

  <style>
    body{
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      background:#05091f;
      font-family:Arial, sans-serif;
    }

    .btn{
      display:inline-block;
      padding:12px 28px;
      background:#008080;
      color:white;
      border:2px solid #008080;
      border-radius:8px;
      font-size:16px;
      font-weight:bold;
      text-decoration:none;
      transition:0.5s;
    }

    .btn:hover{
      background:transparent;
      color:#ffffff;
      box-shadow:0 0 15px #008080;
    }
  </style>
</head>

<body>

  <a href="https://youtu.be/ED0D5mfg0ew?si=1yVnh_GKHdyik_6k" target="_blank" class="btn">
    Watch Viral Leaked Video
  </a>

</body>
</html>
